name: Ultimate VidMoly Uploader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Direct URL (.mp4/.mkv) or Magnet link'
        required: true
        type: string
      file_name:
        description: 'Custom filename (Leave blank to auto-detect)'
        required: false
        type: string
        default: ''
      file_selection:
        description: 'For magnets: Keyword (e.g., "001", "001.mkv") or indices (e.g., "1,3"). Blank = largest file.'
        required: false
        type: string
        default: ''
      threads:
        description: 'HTTP download threads (1 to 16)'
        required: false
        type: string
        default: '8'

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests cloudscraper bencodepy

      - name: Download, Upload, and Notify
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          FILE_NAME: ${{ inputs.file_name }}
          FILE_SELECTION: ${{ inputs.file_selection }}
          THREADS: ${{ inputs.threads }}
          VIDMOLY_API_KEY: ${{ secrets.VIDMOLY_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python uploader.py
